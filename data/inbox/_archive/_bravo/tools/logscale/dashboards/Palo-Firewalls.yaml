  68d4c2c6-1700-42c8-a41c-33a29b9f594c:
    x: 6
    y: 6
    description: CONFIG, SYSTEM, TRAFFIC
    height: 6
    queryString: |-
      #repo = ucq-palofirewall
      // do we care which node it is coming from?
      | case {
          domain = "UCQ-*-FW-EXT-*"   | domaingroup := "UCQ-FW-EXT";
          domain = "UCQ-*-FW-INT-*"   | domaingroup := "UCQ-FW-INT";
          domain = "TWH-CORE-FW-*"    | domaingroup := "TWH-CORE-FW";
          domain = "SAW-CORE-FW-*"    | domaingroup := "SAW-CORE-FW";
          domain = "SSHB-CORE-FW-*"   | domaingroup := "SSHB-CORE-FW";
          domain = "TSCPH-CORE-FW-*"  | domaingroup := "TSCPH-CORE-FW";
          *                           | domaingroup := domain
      }
      | Type = ?TypeFilter
      | domaingroup = SAW-CORE-FW
      | domain != "syslogtest.ps1"                        //exclude my test case
      | timechart(series=Type, span=1h)
    end: now
    start: 1d
    width: 6
    options:
      legendPosition: bottom
      legendLabelOverflow: truncate
      showDataPoints: true
      connect-points: false
      plotType: line
      regression: false
      imputation: none
    visualization: time-chart
    title: 🏥 SAW-CORE-FW [CONFIG, SYSTEM, TRAFFIC]
    isLive: false
    type: query
