
# this is a custom file to reconfigure the keys for tmux running on linux
# it can be edited manually
#   local profile
#   sudo nano ~/.tmux.conf
#   system wide
#   sudo nano /etc/tmux.conf



#change the combination keys from ctrl+b to ctrl+a
unbind C-b
set -g prefix C-a

#change the function keys

# horizontal split from % to h
unbind %
bind h split-window -h

# vertical split from '"' to v
unbind '"'
bind v split-window -v

# Reload tmux config
bind r source-file ~/.tmux.conf

#setting the delay between prefix and command to 5 seconds
set -s escape-time 5

#enable mouse support
set -g mouse on

# Improve colors
set -g default-terminal 'screen-256color'

# Set scrollback buffer to 99999
set -g history-limit 99999



set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'

